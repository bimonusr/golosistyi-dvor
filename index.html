<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffaf0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<body>
<title>Голосистый двор</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;800;900&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen top-down farm canvas; HUD bar on top, quest dropdown, context action panel at the bottom */
:root{
  --ink:#2d2417; --muted:#6f6352; --paper:#fffaf0; --line:#ecdcc0; --coin:#f5b821; --coin-dark:#c48c0c;
  --accent:#e8563a; --accent-dark:#b13a22; --good:#3fae4a; --good-dark:#2a7a32; --mid:#f0a52b; --bad:#d9463b;
  --display:"Rubik", system-ui, sans-serif; --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#4f8a2f;color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none;z-index:5}
.hud > *{pointer-events:auto}
.group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--display);font-weight:800;background:var(--paper);border-radius:999px;padding:6px 14px;box-shadow:0 3px 0 rgba(0,0,0,.2);font-size:16px;white-space:nowrap}
.chip.coins{background:var(--coin);box-shadow:0 3px 0 var(--coin-dark);font-variant-numeric:tabular-nums;font-size:18px}
button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:8px 13px;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 3px 0 var(--accent-dark);touch-action:manipulation;font-size:14px}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--accent-dark)}
button:disabled{background:#d8cdb9;box-shadow:0 3px 0 #b9ad98;cursor:default}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button.green{background:var(--good);box-shadow:0 3px 0 var(--good-dark)}
button.paper{background:var(--paper);color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.2)}
kbd{display:inline-block;font-family:var(--display);font-size:11px;background:rgba(255,255,255,.3);border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:1px}
.paper kbd{background:#efe3cc}
.quests{position:fixed;top:calc(58px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:min(330px,calc(100% - 24px));background:var(--paper);border-radius:16px;padding:12px 14px;box-shadow:0 6px 0 rgba(0,0,0,.18);z-index:6}
.quests h2{font-family:var(--display);font-size:16px;margin:0 0 6px;display:flex;justify-content:space-between;gap:8px}
.quests h2 small{font-family:var(--body);color:var(--muted);font-size:12px}
.quest{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding-block:6px;border-top:1px dashed #e3d3b5}
.quest:first-of-type{border-top:0}
.quest .txt{font-weight:800;font-size:14px;min-width:0}
.quest .bar{grid-column:1;height:6px;background:#efe3cc;border-radius:9px;overflow:hidden}
.quest .bar i{display:block;height:100%;background:var(--good)}
.quest .side{grid-row:1 / span 2;grid-column:2;font-weight:800;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.quest.done .txt{text-decoration:line-through;color:var(--muted)}
.act{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 24px));background:var(--paper);border-radius:18px;padding:12px 14px;box-shadow:0 6px 0 rgba(0,0,0,.2);z-index:5;display:flex;flex-direction:column;gap:8px}
.act .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.act .head b{font-family:var(--display);font-size:18px}
.act .head span{color:var(--muted);font-weight:800;font-size:13px}
.act .btns{display:flex;gap:8px;flex-wrap:wrap}
.act .btns button{flex:1 1 auto}
.mood{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--muted)}
.mood .track{flex:1;height:8px;background:#efe3cc;border-radius:9px;overflow:hidden}
.mood .track i{display:block;height:100%}
.hint{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));background:rgba(45,36,23,.75);color:var(--paper);border-radius:12px;padding:8px 12px;font-weight:800;font-size:13px;z-index:4;max-width:calc(100% - 24px);transition:opacity .4s}
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(45,36,23,.45)}
.card{background:var(--paper);border-radius:22px;padding:20px;max-width:380px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 0 rgba(0,0,0,.2)}
.card h2{font-family:var(--display);font-weight:900;font-size:24px;margin:0;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-weight:700;line-height:1.4}
.bigemo{font-size:72px;line-height:1}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.row button{font-size:16px;padding:10px 16px}
.rec-on{background:var(--bad)!important;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.7}}
.filebtn{display:inline-block;font-weight:800;color:var(--accent-dark);text-decoration:underline;cursor:pointer}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0}
.note{font-size:13px;background:#fff1d6;border-radius:12px;padding:8px 10px;font-weight:700}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(-10px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:800;opacity:0;transition:.25s;z-index:30;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:560px){ .chip.title{display:none} }
</style>

<canvas id="c"></canvas>

<div class="hud">
  <div class="group">
    <span class="chip title">Голосистый двор</span>
    <span class="chip coins" id="coins">🪙 0</span>
  </div>
  <div class="group">
    <button id="chorusBtn">🎶 Хор<kbd>Q</kbd></button>
    <button class="paper" id="questBtn">Задания</button>
  </div>
</div>

<section class="quests" id="questsPanel" hidden>
  <h2>Задания на сегодня <small id="questReset"></small></h2>
  <div id="quests"></div>
</section>

<section class="act" id="act" hidden>
  <div class="head"><b id="actTitle"></b><span id="actSub"></span></div>
  <div class="mood" id="actMood" hidden><span>Настроение</span><span class="track"><i id="actMoodBar"></i></span><span id="actMoodLbl"></span></div>
  <div class="btns" id="actBtns"></div>
</section>

<div class="hint" id="hint">Ходить: WASD, стрелки или клик мышью. Действие: E. Хор: Q.</div>

<div class="overlay" id="rec" hidden>
  <div class="card" role="dialog" aria-labelledby="recTitle">
    <div class="bigemo" id="recEmoji">🐔</div>
    <h2 id="recTitle">Озвучь курицу</h2>
    <p>Нажми «Записать» и покричи за неё. Запись идёт 3 секунды.</p>
    <div class="note" id="micNote" hidden>Микрофон недоступен. Разреши доступ в настройках браузера или выбери аудиофайл ниже.</div>
    <div class="row">
      <button id="recBtn">● Записать</button>
      <button class="paper" id="recPlay" hidden>▶ Послушать</button>
    </div>
    <label class="filebtn">или загрузить аудиофайл<input type="file" id="recFile" accept="audio/*"></label>
    <div class="row">
      <button class="green" id="recSave" hidden>Сохранить голос</button>
      <button class="paper" id="recClose">Отмена</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');

/* ---------- data ---------- */
const ANIMALS = [
  {id:'chicken', name:'Курица', acc:'курицу', emoji:'🐔', cost:0,    rate:1,   every:5, pitch:1.55, feed:5,   size:34},
  {id:'goat',    name:'Коза',   acc:'козу',   emoji:'🐐', cost:60,   rate:3,   every:6, pitch:1.25, feed:12,  size:40},
  {id:'pig',     name:'Свинья', acc:'свинью', emoji:'🐖', cost:250,  rate:8,   every:7, pitch:0.95, feed:30,  size:42},
  {id:'sheep',   name:'Овца',   acc:'овцу',   emoji:'🐑', cost:700,  rate:20,  every:7, pitch:1.12, feed:70,  size:42},
  {id:'cow',     name:'Корова', acc:'корову', emoji:'🐄', cost:1800, rate:45,  every:8, pitch:0.72, feed:150, size:50},
  {id:'horse',   name:'Лошадь', acc:'лошадь', emoji:'🐎', cost:4500, rate:110, every:9, pitch:0.85, feed:350, size:52},
];
const BY = Object.fromEntries(ANIMALS.map(a => [a.id, a]));
const MAX_CRIES = 30, PET_CD = 15, CHORUS_CD = 30, DECAY = 100/600;
const KEY = 'golosistyi-dvor-v1';

const WORLD = {w:1600, h:1100};
const PW = 260, PH = 190;
const PLOTS = [[170,140],[670,140],[1170,140],[170,770],[670,770],[1170,770]].map(([x,y], i) => {
  const top = i < 3;
  return { x, y, w:PW, h:PH, top, spot: { x: x + PW/2, y: top ? y + PH + 30 : y - 30 } };
});
const STAGE = { x: 800, y: 555, r: 44 };
STAGE.spot = { x: STAGE.x, y: STAGE.y + 70 };
const POND = { x: 330, y: 555, rx: 110, ry: 62 };
const TREES = [[60,70],[1540,80],[60,1040],[1530,1030],[540,560],[1080,520],[1250,600],[1470,470],[1460,640],[110,460],[95,650],[800,1050],[460,1060],[1150,1060],[800,40],[460,50],[1140,45]]
  .map(([x,y]) => ({x, y, r: 26 + ((x*7+y*3) % 12)}));

/* ---------- state (общий с прошлой версией) ---------- */
let S = null;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
if (!S || !S.owned) S = { coins: 20, owned: { chicken: newAnimal() }, day: '', quests: [], counters: {}, last: Date.now(), chorusAt: 0 };
function newAnimal(){ return { mood: 80, pending: 0, acc: 0, voiced: false, petAt: 0 }; }
function save(){ S.last = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
const moodMult = m => m >= 70 ? 2 : m >= 30 ? 1 : 0.3;
const moodInfo = m => m >= 70 ? ['Довольна', '#3fae4a'] : m >= 30 ? ['Нормально', '#f0a52b'] : ['Грустит', '#d9463b'];
const fmt = n => Math.floor(n).toLocaleString('ru-RU');
const today = () => new Date().toISOString().slice(0,10);
const voicedIds = () => Object.keys(S.owned).filter(id => S.owned[id].voiced);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const rand = (a,b) => a + Math.random()*(b-a);

(function offline(){
  const sec = Math.min(7200, Math.max(0, (Date.now() - (S.last || Date.now())) / 1000));
  if (sec < 5) return;
  let earned = 0;
  for (const id in S.owned) {
    const st = S.owned[id], a = BY[id];
    if (!st.voiced) continue;
    let t = st.acc + sec;
    while (t >= a.every) {
      t -= a.every;
      st.mood = Math.max(0, st.mood - DECAY * a.every);
      const cap = a.rate * 2 * MAX_CRIES, g = Math.round(a.rate * moodMult(st.mood));
      if (st.pending < cap) { st.pending = Math.min(cap, st.pending + g); earned += g; }
    }
    st.acc = t;
  }
  if (earned > 0) setTimeout(() => toast(`Пока тебя не было, ферма накричала ${fmt(earned)} 🪙. Собери у загонов!`), 600);
})();

/* ---------- quests ---------- */
const raz = n => (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? 'раза' : 'раз';
const QPOOL = [
  { key:'feed',     text:n => `Покорми животных ${n} ${raz(n)}`, n:[3,5] },
  { key:'pet',      text:n => `Погладь животных ${n} ${raz(n)}`, n:[5,8] },
  { key:'chorus',   text:n => `Спой хором ${n} ${raz(n)}`,       n:[2,3], need: () => voicedIds().length >= 3 },
  { key:'collect',  text:n => `Собери ${fmt(n)} монет`,          n:[0,0], dyn:true },
  { key:'record',   text:() => `Перезапиши голос любому животному`, n:[1,1] },
  { key:'allhappy', text:() => `Сделай всех довольными одновременно`, n:[1,1], need: () => Object.keys(S.owned).length >= 2 },
];
function rollQuests(){
  S.day = today(); S.counters = {};
  const owned = Object.keys(S.owned).length;
  S.quests = QPOOL.filter(q => !q.need || q.need()).sort(() => Math.random() - .5).slice(0, 3).map(q => ({
    key: q.key,
    need: q.dyn ? Math.round(40 * Math.pow(2.6, owned - 1) / 10) * 10 : q.n[0] + Math.floor(Math.random() * (q.n[1] - q.n[0] + 1)),
    reward: Math.round(15 * Math.pow(2.3, owned - 1) / 5) * 5 + 10, claimed: false }));
  save();
}
function bump(key, by = 1){ S.counters[key] = (S.counters[key] || 0) + by; }
function questsReady(){ return S.quests.filter(q => !q.claimed && (S.counters[q.key] || 0) >= q.need).length; }
function renderQuests(){
  if (S.day !== today()) rollQuests();
  const box = $('quests'); box.innerHTML = '';
  for (const q of S.quests) {
    const def = QPOOL.find(d => d.key === q.key);
    const have = Math.min(q.need, S.counters[q.key] || 0), done = have >= q.need;
    const row = document.createElement('div'); row.className = 'quest' + (q.claimed ? ' done' : '');
    const txt = document.createElement('span'); txt.className = 'txt'; txt.textContent = def.text(q.need);
    const side = document.createElement('span'); side.className = 'side';
    if (q.claimed) side.textContent = 'Готово ✓';
    else if (done) { const b = document.createElement('button'); b.className = 'green'; b.textContent = `Забрать +${fmt(q.reward)}`;
      b.onclick = () => { q.claimed = true; S.coins += q.reward; ding(1046); toast(`+${fmt(q.reward)} 🪙 за задание`); save(); renderQuests(); refreshHud(); }; side.appendChild(b); }
    else side.textContent = `${fmt(have)} / ${fmt(q.need)}`;
    const bar = document.createElement('span'); bar.className = 'bar'; bar.innerHTML = `<i style="width:${have / q.need * 100}%"></i>`;
    row.append(txt, side, bar); box.appendChild(row);
  }
  const ms = new Date(new Date().setHours(24,0,0,0)) - Date.now();
  $('questReset').textContent = `новые через ${Math.floor(ms/3600000)} ч ${Math.floor(ms/60000)%60} мин`;
}
$('questBtn').onclick = () => { $('questsPanel').hidden = !$('questsPanel').hidden; renderQuests(); };

/* ---------- audio ---------- */
let ac = null;
const buffers = {};
function ensureAC(){
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
  if (ac && ac.state === 'suspended') ac.resume();
  return ac;
}
function playBuffer(buf, rate, vol = 1, when = 0, pan = 0){
  if (!ac || !buf) return;
  const s = ac.createBufferSource(), g = ac.createGain();
  s.buffer = buf; s.playbackRate.value = rate; g.gain.value = vol;
  let node = s.connect(g);
  if (ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); node = node.connect(p); }
  node.connect(ac.destination); s.start(ac.currentTime + when);
}
function voiceRate(id){ const m = S.owned[id].mood; return BY[id].pitch * (m >= 70 ? 1.12 : m < 30 ? 0.78 : 1); }
function playVoice(id, when = 0, vol = 1){
  const i = ANIMALS.findIndex(a => a.id === id), pl = PLOTS[i];
  const dx = pl.x + PW/2 - P.x, dist = Math.hypot(dx, pl.y + PH/2 - P.y);
  playBuffer(buffers[id], voiceRate(id), vol * clamp(1.2 - dist/900, 0.25, 1), when, dx / 500);
}
function ding(f = 880){
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(.1, t); g.gain.exponentialRampToValueAtTime(.001, t + .15);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + .17);
}
function idb(){ return new Promise((res, rej) => { const r = indexedDB.open('golosistyi-dvor', 1); r.onupgradeneeded = () => r.result.createObjectStore('voices'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbPut(k, v){ const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction('voices', 'readwrite'); tx.objectStore('voices').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
async function idbGet(k){ const db = await idb(); return new Promise((res, rej) => { const r = db.transaction('voices').objectStore('voices').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function decode(blob){ ensureAC(); const ab = await blob.arrayBuffer(); return await new Promise((res, rej) => ac.decodeAudioData(ab, res, rej)); }
async function loadVoices(){
  for (const id of voicedIds()) {
    try { const blob = await idbGet(id); if (blob) buffers[id] = await decode(blob); else S.owned[id].voiced = false; }
    catch(e) { S.owned[id].voiced = false; }
  }
  save();
}

/* ---------- world objects ---------- */
const P = { x: 800, y: 690, r: 14, dir: 1, walk: 0, moving: false };
let moveTarget = null, pendingSpot = null;
const keys = {};
const anims = {};
function animFor(i){
  const a = ANIMALS[i];
  if (!anims[a.id]) { const pl = PLOTS[i]; anims[a.id] = { x: pl.x + PW/2, y: pl.y + PH/2, tx: pl.x + PW/2, ty: pl.y + PH/2, dir: -1, wait: rand(0,2), bubble: '', bt: 0, hop: 0 }; }
  return anims[a.id];
}
const pops = [];
function pop(x, y, text, col = '#fff'){ pops.push({ x, y, text, col, life: 1 }); }
function cry(id, text){ const an = anims[id]; if (!an) return; an.bubble = text; an.bt = 1.1; an.hop = .45; }

// декор
const DECOR = [];
(function(){ let s = 7; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < 260; i++) DECOR.push({ x: r()*WORLD.w, y: r()*WORLD.h, k: r() < .12 ? 'flower' : 'tuft', c: ['#ffd84d','#ff8fb1','#ffffff','#b48cff'][Math.floor(r()*4)] });
})();

function blocked(x, y){
  const r = P.r;
  if (x < r || y < r || x > WORLD.w - r || y > WORLD.h - r) return true;
  for (const pl of PLOTS) if (x > pl.x - r && x < pl.x + pl.w + r && y > pl.y - r && y < pl.y + pl.h + r) return true;
  for (const t of TREES) if (Math.hypot(x - t.x, y - (t.y + 10)) < t.r * 0.55 + r) return true;
  if (Math.hypot(x - STAGE.x, y - STAGE.y) < STAGE.r + r) return true;
  const ex = (x - POND.x) / (POND.rx + r), ey = (y - POND.y) / (POND.ry + r);
  if (ex*ex + ey*ey < 1) return true;
  return false;
}

/* ---------- nearby & actions ---------- */
function nearby(){
  let best = null, bd = 70;
  PLOTS.forEach((pl, i) => { const d = Math.hypot(P.x - pl.spot.x, P.y - pl.spot.y); if (d < bd) { bd = d; best = { type: 'plot', i }; } });
  const d = Math.hypot(P.x - STAGE.spot.x, P.y - STAGE.spot.y);
  if (d < bd) best = { type: 'stage' };
  return best;
}
function nextLockedIndex(){ return ANIMALS.findIndex(a => !S.owned[a.id]); }

function pet(a){
  ensureAC(); const st = S.owned[a.id];
  playVoice(a.id); cry(a.id, '♥');
  if ((Date.now() - st.petAt) / 1000 >= PET_CD) { st.petAt = Date.now(); st.mood = Math.min(100, st.mood + 15); bump('pet'); save(); }
  else toast('Уже гладил, дай ей немного отдохнуть');
}
function feed(a){
  ensureAC(); const st = S.owned[a.id];
  if (S.coins < a.feed || st.mood >= 98) return;
  S.coins -= a.feed; st.mood = Math.min(100, st.mood + 40); bump('feed');

/* ---------- update ---------- */
function update(dt){
  // движение игрока
  let mx = 0, my = 0;
  if (keys.KeyA || keys.ArrowLeft) mx--;
  if (keys.KeyD || keys.ArrowRight) mx++;
  if (keys.KeyW || keys.ArrowUp) my--;
  if (keys.KeyS || keys.ArrowDown) my++;
  if (mx || my) { moveTarget = null; hideHint(); }
  else if (moveTarget) {
    const dx = moveTarget.x - P.x, dy = moveTarget.y - P.y, d = Math.hypot(dx, dy);
    if (d < 4) moveTarget = null; else { mx = dx / d; my = dy / d; }
  }
  P.moving = false;
  if (mx || my) {
    const l = Math.hypot(mx, my); mx /= l; my /= l;
    const sp = 230 * dt, ox = P.x, oy = P.y;
    if (!blocked(P.x + mx * sp, P.y)) P.x += mx * sp;
    if (!blocked(P.x, P.y + my * sp)) P.y += my * sp;
    if (Math.abs(P.x - ox) + Math.abs(P.y - oy) < 0.01) moveTarget = null;
    else { P.moving = true; P.walk += dt; if (mx) P.dir = mx < 0 ? -1 : 1; }
  }
  // сбор монет
  ANIMALS.forEach((a, i) => {
    const st = S.owned[a.id]; if (!st || st.pending <= 0) return;
    const pl = PLOTS[i];
    if (Math.hypot(P.x - pl.spot.x, P.y - pl.spot.y) < 32) {
      const g = st.pending; S.coins += g; bump('collect', g); st.pending = 0;
      pop(pl.spot.x, pl.spot.y - 30, '+' + fmt(g) + ' 🪙', '#ffe27a'); ding(988); setTimeout(() => ding(1318), 70); save();
    }
  });
  // животные
  ANIMALS.forEach((a, i) => {
    const st = S.owned[a.id]; if (!st) return;
    const an = animFor(i), pl = PLOTS[i];
    const speed = st.mood >= 70 ? 42 : st.mood >= 30 ? 30 : 16;
    an.wait -= dt;
    if (an.wait <= 0) {
      const dx = an.tx - an.x, dy = an.ty - an.y, d = Math.hypot(dx, dy);
      if (d < 2) { an.wait = rand(0.8, 3); an.tx = rand(pl.x + 30, pl.x + pl.w - 30); an.ty = rand(pl.y + 40, pl.y + pl.h - 18); }
      else { an.x += dx / d * speed * dt; an.y += dy / d * speed * dt; if (Math.abs(dx) > 1) an.dir = dx < 0 ? -1 : 1; }
    }
    an.bt = Math.max(0, an.bt - dt); an.hop = Math.max(0, an.hop - dt);
    if (!st.voiced) return;
    st.mood = Math.max(0, st.mood - DECAY * dt);
    st.acc += dt;
    if (st.acc >= a.every) {
      st.acc -= a.every;
      const cap = a.rate * 2 * MAX_CRIES;
      if (st.pending < cap) { st.pending = Math.min(cap, st.pending + Math.round(a.rate * moodMult(st.mood))); cry(a.id, '🪙'); }
      else cry(a.id, 'полно!');
    }
  });
  const ids = Object.keys(S.owned);
  if (ids.length >= 2 && ids.every(id => S.owned[id].voiced && S.owned[id].mood >= 70)) S.counters.allhappy = 1;
  for (let i = pops.length - 1; i >= 0; i--) { pops[i].life -= dt * .8; pops[i].y -= 30 * dt; if (pops[i].life <= 0) pops.splice(i, 1); }
}

const WOOD = '#a86a3d', WOOD_D = '#6f4424';
function fence(pl, faded){
  const { x, y, w, h, top } = pl, gate = 56, gx = x + w/2;
  ctx.globalAlpha = faded ? .45 : 1;
  ctx.strokeStyle = WOOD; ctx.lineWidth = 4; ctx.lineCap = 'round';
  const rail = (x1, y1, x2, y2) => { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x1, y1 - 8); ctx.lineTo(x2, y2 - 8); ctx.stroke(); };
  const gy = top ? y + h : y;
  const oy = top ? y : y + h;
  rail(x, oy, x + w, oy);
  rail(x, y, x, y + h); rail(x + w, y, x + w, y + h);
  rail(x, gy, gx - gate/2, gy); rail(gx + gate/2, gy, x + w, gy);
  ctx.fillStyle = WOOD_D;
  const post = (px, py) => { ctx.fillRect(px - 3, py - 14, 6, 16); };
  for (let px = x; px <= x + w + 1; px += 26) { post(px, oy); if (Math.abs(px - gx) > gate/2) post(px, gy); }
  for (let py = y; py <= y + h + 1; py += 26) { post(x, py); post(x + w, py); }
  post(gx - gate/2, gy); post(gx + gate/2, gy);

}
function drawTree(t){

}

function drawLabel(i){

function drawAnimal(i){

function draw(){
  cam.x = W >= WORLD.w ? (WORLD.w - W) / 2 : clamp(P.x - W/2, 0, WORLD.w - W);
  cam.y = H >= WORLD.h ? (WORLD.h - H) / 2 : clamp(P.y - H/2, 0, WORLD.h - H);
  ctx.fillStyle = '#4f8a2f'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(-Math.round(cam.x), -Math.round(cam.y));
  // трава
  ctx.fillStyle = '#86c95a'; ctx.fillRect(0, 0, WORLD.w, WORLD.h);
  for (const d of DECOR) {
    if (d.k === 'tuft') { ctx.fillStyle = '#6fb447'; ctx.fillRect(d.x, d.y, 3, 6); ctx.fillRect(d.x + 4, d.y + 1, 3, 5); }
    else { ctx.fillStyle = d.c; ctx.beginPath(); ctx.arc(d.x, d.y, 3, 0, 7); ctx.fill(); }
  }
  // дорожки
  ctx.fillStyle = '#d8b77e';
  ctx.fillRect(120, 525, 1360, 60);
  PLOTS.forEach(pl => { const x = pl.x + PW/2 - 26; if (pl.top) ctx.fillRect(x, pl.y + PH, 52, 525 - (pl.y + PH)); else ctx.fillRect(x, 585, 52, pl.y - 585); });
  ctx.fillRect(STAGE.x - 70, 525, 140, 110);

  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2;
  const tt = performance.now() / 900;
  for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.ellipse(POND.x - 30 + k * 30, POND.y - 10 + k * 12, 14 + Math.sin(tt + k) * 3, 4, 0, 0, 7); ctx.stroke(); }
  // загоны

$('recBtn').onclick = async () => {
  ensureAC();
  if (mediaRec && mediaRec.state === 'recording') { stopRec(); return; }
  let stream;
  try {
    if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) throw new Error('no');
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch(e) { $('micNote').hidden = false; return; }
  const chunks = [];
  mediaRec = new MediaRecorder(stream);
  mediaRec.ondataavailable = e => e.data.size && chunks.push(e.data);
  mediaRec.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    $('recBtn').textContent = '● Записать заново'; $('recBtn').classList.remove('rec-on');
    await setDraft(new Blob(chunks, { type: mediaRec.mimeType || 'audio/webm' }));
  };
  mediaRec.start();
  $('recBtn').textContent = '■ Стоп'; $('recBtn').classList.add('rec-on');
  recTimer = setTimeout(stopRec, 3000);
};
$('recFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  if (f.size > 3 * 1024 * 1024) { toast('Файл великоват. Нужна короткая запись, до пары секунд.'); return; }
  await setDraft(f);
};
async function setDraft(blob){
  try { draftBuf = await decode(blob); draftBlob = blob; $('recPlay').hidden = false; $('recSave').hidden = false; playBuffer(draftBuf, recAnimal.pitch); }
  catch(e) { toast('Не получилось прочитать звук. Попробуй ещё раз.'); }
}
$('recPlay').onclick = () => { ensureAC(); if (draftBuf) playBuffer(draftBuf, recAnimal.pitch); };
$('recSave').onclick = async () => {
  if (!draftBuf || !recAnimal) return;
  const a = recAnimal, st = S.owned[a.id], was = st.voiced;
  buffers[a.id] = draftBuf; st.voiced = true;
  try { await idbPut(a.id, draftBlob); } catch(e) { toast('Голос сохранён только до перезагрузки страницы'); }
  if (was) bump('record');
  closeRec(); save(); actSig = ''; refreshHud();
  playVoice(a.id); cry(a.id, '!!!');
  if (!was) toast(`${a.name} заговорила твоим голосом и начала приносить монеты`);
};

/* ---------- misc ---------- */
let toastT;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800); }

/* ---------- loop ---------- */
let last = performance.now(), hudAcc = 0, saveAcc = 0;
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  hudAcc += dt; if (hudAcc > 0.2) { hudAcc = 0; refreshHud(); }
  saveAcc += dt; if (saveAcc > 3) { saveAcc = 0; save(); }
  requestAnimationFrame(frame);
}
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); last = performance.now(); });

if (S.day !== today() || !S.quests.length) rollQuests();
ANIMALS.forEach((a, i) => { if (S.owned[a.id]) animFor(i); });
resize(); refreshHud();
requestAnimationFrame(frame);
loadVoices();
})();
</script>
